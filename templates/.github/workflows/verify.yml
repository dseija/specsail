name: verify
on:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js (for SpecSail CLI)
        uses: actions/setup-node@v7
        with:
          node-version: 20
      # Add your stack's setup action here if make setup needs it.
      - run: make setup
      - run: make verify
      - run: make check-protected BASE=origin/${{ github.base_ref }}
